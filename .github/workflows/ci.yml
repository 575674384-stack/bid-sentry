name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --run
      - run: pnpm test:coverage
      - run: pnpm build
      - run: git diff --check
      - run: xvfb-run -a pnpm test:e2e
      - run: pnpm package:linux
      - run: pnpm audit:package
      - run: xvfb-run -a pnpm test:e2e:production
        env:
          BID_SENTRY_PACKAGED_APP: release/linux-unpacked/bid-sentry
      - run: (cd release && sha256sum *.AppImage *.deb latest*.yml) > release/SHA256SUMS
      - run: pnpm package:e2e:linux
      - run: xvfb-run -a pnpm test:e2e:packaged
        env:
          BID_SENTRY_PACKAGED_E2E_APP: ${{ github.workspace }}/.e2e-release/linux-unpacked/bid-sentry-e2e
      - uses: actions/upload-artifact@v4
        with:
          name: bid-sentry-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/SHA256SUMS
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --run
      - run: pnpm test:coverage
      - run: pnpm build
      - run: git diff --check
      - run: pnpm test:e2e
      - run: pnpm package:win
      - run: pnpm audit:package
      - shell: pwsh
        run: |
          $env:BID_SENTRY_PACKAGED_APP = "$env:GITHUB_WORKSPACE\release\win-unpacked\bid-sentry.exe"
          pnpm test:e2e:production
      - shell: pwsh
        run: |
          $files = @(Get-ChildItem release -File | Where-Object { $_.Extension -in @('.exe', '.7z') -or $_.Name -like 'latest*.yml' })
          if ($files.Count -eq 0) { throw 'No Windows release assets were produced.' }
          $lines = $files | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "{0}  {1}" -f $hash, $_.Name
          }
          # Write UTF-8 without BOM and LF line endings so Linux release checks
          # and downstream sha256sum consumers parse the manifest identically.
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path $PWD 'release/SHA256SUMS'), (($lines -join "`n") + "`n"), $utf8NoBom)
      - run: pnpm package:e2e:win
      - shell: pwsh
        run: |
          $env:BID_SENTRY_PACKAGED_E2E_APP = "$env:GITHUB_WORKSPACE\.e2e-release\win-unpacked\bid-sentry-e2e.exe"
          pnpm test:e2e:packaged
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v4
        with:
          name: bid-sentry-windows-x64
          path: |
            release/*.exe
            release/*.7z
            release/latest*.yml
            release/SHA256SUMS
          if-no-files-found: error

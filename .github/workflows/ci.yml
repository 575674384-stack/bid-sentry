name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --run
      - run: pnpm build
      - run: xvfb-run -a pnpm test:e2e
      - run: pnpm package:linux
      - run: pnpm audit:package
      - run: xvfb-run -a pnpm test:e2e:packaged
        env:
          BID_SENTRY_PACKAGED_APP: release/linux-unpacked/bid-sentry
      - uses: actions/upload-artifact@v4
        with:
          name: bid-sentry-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --run
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm package:win
      - run: pnpm audit:package
      - run: pnpm test:e2e:packaged
        env:
          BID_SENTRY_PACKAGED_APP: release/win-unpacked/bid-sentry.exe
      - uses: actions/upload-artifact@v4
        with:
          name: bid-sentry-windows-x64
          path: release/*.exe
          if-no-files-found: error

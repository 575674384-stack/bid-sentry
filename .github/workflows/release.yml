name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified release assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify immutable tag and package version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "$(node -p "require('./package.json').version")" = "${version}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/${GITHUB_REF_NAME}")"

      - name: Wait for successful CI run for this exact commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 90); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 20 --json databaseId,status,conclusion --jq '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId' | head -n 1 || true)"
            if [ -n "$run_id" ]; then break; fi
            sleep 20
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download Linux CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/linux
          gh run download "${{ steps.ci.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name bid-sentry-linux-x64 \
            --dir release-assets/linux
          downloaded_dir='release-assets/linux/bid-sentry-linux-x64'
          if [ -d "$downloaded_dir" ]; then
            find "$downloaded_dir" -mindepth 1 -maxdepth 1 -type f -exec mv -t release-assets/linux -- {} +
            rmdir "$downloaded_dir"
          fi
          test -f release-assets/linux/SHA256SUMS

      - name: Download Windows CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/windows
          gh run download "${{ steps.ci.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name bid-sentry-windows-x64 \
            --dir release-assets/windows
          downloaded_dir='release-assets/windows/bid-sentry-windows-x64'
          if [ -d "$downloaded_dir" ]; then
            find "$downloaded_dir" -mindepth 1 -maxdepth 1 -type f -exec mv -t release-assets/windows -- {} +
            rmdir "$downloaded_dir"
          fi
          test -f release-assets/windows/SHA256SUMS

      - name: Verify asset set, checksums, and metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          linux_appimages=(release-assets/linux/*.AppImage)
          linux_debs=(release-assets/linux/*.deb)
          windows_setup=(release-assets/windows/*setup*.exe)
          windows_portable=(release-assets/windows/*portable*.exe)
          test "${#linux_appimages[@]}" -eq 1
          test "${#linux_debs[@]}" -eq 1
          test "${#windows_setup[@]}" -eq 1
          test "${#windows_portable[@]}" -eq 1
          test -f release-assets/linux/latest-linux.yml
          test -f release-assets/windows/latest.yml
          test ! -e release-assets/linux/builder-debug.yml
          test ! -e release-assets/windows/builder-debug.yml
          grep -Fxq "version: ${version}" release-assets/linux/latest-linux.yml
          grep -Fxq "version: ${version}" release-assets/windows/latest.yml
          grep -Fxq "path: bid-sentry-${version}-linux-x86_64.AppImage" release-assets/linux/latest-linux.yml
          grep -Fxq "path: bid-sentry-setup-${version}-win-x64.exe" release-assets/windows/latest.yml
          VERSION="${version}" node - <<'NODE'
          const { createHash } = require('node:crypto')
          const { readFileSync } = require('node:fs')
          const version = process.env.VERSION
          function metadataSha512(metadataPath, targetName) {
            const lines = readFileSync(metadataPath, 'utf8').split(/\r?\n/u)
            const index = lines.findIndex((line) => line.trim() === `- url: ${targetName}`)
            if (index < 0) throw new Error(`${metadataPath} is missing ${targetName}`)
            const shaLine = lines
              .slice(index + 1, index + 6)
              .find((line) => line.trim().startsWith('sha512:'))
            const sha = shaLine?.split(':').slice(1).join(':').trim()
            if (!sha) throw new Error(`${metadataPath} is missing sha512 for ${targetName}`)
            return sha
          }
          function assertMetadata(metadataPath, targetPath) {
            const targetName = targetPath.split('/').at(-1)
            if (!targetName) throw new Error(`Invalid target path: ${targetPath}`)
            const expected = createHash('sha512').update(readFileSync(targetPath)).digest('base64')
            const actual = metadataSha512(metadataPath, targetName)
            if (actual !== expected) throw new Error(`${metadataPath} sha512 does not match ${targetPath}`)
          }
          assertMetadata(
            'release-assets/linux/latest-linux.yml',
            `release-assets/linux/bid-sentry-${version}-linux-x86_64.AppImage`
          )
          assertMetadata(
            'release-assets/windows/latest.yml',
            `release-assets/windows/bid-sentry-setup-${version}-win-x64.exe`
          )
          NODE
          test -f release-assets/linux/SHA256SUMS
          test -f release-assets/windows/SHA256SUMS
          (cd release-assets/linux && sha256sum -c SHA256SUMS)
          (cd release-assets/windows && sha256sum -c SHA256SUMS)
          while IFS= read -r file; do
            case "$file" in
              SHA256SUMS|*.exe|*.AppImage|*.deb|*.7z|latest.yml|latest-linux.yml) : ;;
              *) echo "Unexpected release asset: $file" >&2; exit 1 ;;
            esac
          done < <(find release-assets -type f -printf '%f\n')

      - name: Build release manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/final
          find release-assets/linux release-assets/windows -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*setup*.exe' -o -name '*portable*.exe' -o -name 'latest.yml' -o -name 'latest-linux.yml' \) \
            -exec cp {} release-assets/final/ \;
          cp LICENSE release-assets/final/LICENSE
          node - <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')
          const { createHash } = require('node:crypto')
          const { readdirSync } = require('node:fs')
          const assets = readdirSync('release-assets/final')
            .filter((name) => name !== 'SHA256SUMS' && name !== 'release-manifest.json')
            .sort()
          const hashes = Object.fromEntries(assets.map((name) => [name, createHash('sha256').update(readFileSync(`release-assets/final/${name}`)).digest('hex')]))
          writeFileSync('release-assets/final/release-manifest.json', `${JSON.stringify({ schemaVersion: 1, tag: process.env.GITHUB_REF_NAME, commit: process.env.GITHUB_SHA, assets: hashes }, null, 2)}\n`)
          NODE
          (cd release-assets/final && sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort) > SHA256SUMS)
          (cd release-assets/final && find . -maxdepth 1 -type f -printf '%f\n' | sort > ../expected-assets.txt)
          test -f release-assets/final/LICENSE
          test -f release-assets/final/release-manifest.json
          test -f release-assets/final/SHA256SUMS
          (cd release-assets/final && sha256sum -c SHA256SUMS)
          test "$(find release-assets/final -maxdepth 1 -type f | wc -l)" -eq 9
          test "$(find release-assets/final -maxdepth 1 -type f -name '*.7z' | wc -l)" -eq 0

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tag="${GITHUB_REF_NAME}"
          notes='release-notes.md'
          cat > "$notes" <<EOF
          # Bid Sentry v${version}

          元数据安全重置、招投标文件对照审查、资格标模板预制作、可选系统托盘和确认式 GitHub Releases 更新。各版本变更明细见仓库 CHANGELOG.md。

          OCR 暂不支持；扫描 PDF 的审查/预制作需要可靠文本层；生成 DOCX 和 AI finding 都需要人工复核。发布包未做代码签名，请核对 SHA256SUMS。
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A published release is immutable for this workflow. A draft may
            # be resumed only when every existing asset is an exact byte match
            # for this build. Partial uploads are valid and are completed below;
            # unexpected assets, stale metadata, or mismatched bytes stop here.
            release_json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,title,body,assets)"
            test "$(jq -r '.isDraft' <<<"$release_json")" = "true"
            test "$(jq -r '.isPrerelease' <<<"$release_json")" = "false"
            if [[ "$(jq -r '.title' <<<"$release_json")" != "Bid Sentry v${version}" || "$(jq -r '.body' <<<"$release_json")" != "$(cat "$notes")" ]]; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "Bid Sentry v${version}" --notes-file "$notes"
              release_json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,title,body,assets)"
            fi
            rm -rf existing-release
            mkdir -p existing-release
            mapfile -t draft_asset_names < <(jq -r '.assets[]?.name' <<<"$release_json")
            for asset_name in "${draft_asset_names[@]}"; do
              gh release download "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset_name" \
                --dir existing-release
            done
          node - <<'NODE'
            const { readFileSync, readdirSync } = require('node:fs')
            const { createHash } = require('node:crypto')
            const expected = JSON.parse(readFileSync('release-assets/final/release-manifest.json', 'utf8'))
            const expectedFiles = new Set(readFileSync('release-assets/expected-assets.txt', 'utf8').trim().split(/\r?\n/u))
            const expectedBytes = new Map(Object.entries(expected.assets))
            for (const name of readdirSync('existing-release')) {
              if (!expectedFiles.has(name)) throw new Error(`Unexpected existing draft asset: ${name}`)
              if (name === 'release-manifest.json') {
                const actual = JSON.parse(readFileSync(`existing-release/${name}`, 'utf8'))
                if (actual.schemaVersion !== 1 || actual.tag !== expected.tag || actual.commit !== expected.commit || JSON.stringify(actual.assets) !== JSON.stringify(expected.assets)) {
                  throw new Error('Existing draft release manifest does not match this immutable commit.')
                }
                continue
              }
              if (name === 'SHA256SUMS') continue
              const expectedHash = expectedBytes.get(name)
              if (typeof expectedHash !== 'string') throw new Error(`Missing expected hash: ${name}`)
              const path = `existing-release/${name}`
              const actualHash = createHash('sha256').update(readFileSync(path)).digest('hex')
              if (actualHash !== expectedHash) {
                throw new Error(`Existing draft asset bytes/hash differ: ${name}`)
              }
            }
          NODE
            if [[ -f existing-release/SHA256SUMS ]]; then cmp -s existing-release/SHA256SUMS release-assets/final/SHA256SUMS; fi
            mapfile -t existing_names < <(jq -r '.assets[]?.name' <<<"$release_json" | sort)
            missing_assets=()
            while IFS= read -r name; do
              if printf '%s\n' "${existing_names[@]}" | grep -Fxq "$name"; then
                continue
              fi
              test -f "release-assets/final/$name"
              missing_assets+=("release-assets/final/$name")
            done < release-assets/expected-assets.txt
            if ((${#missing_assets[@]} > 0)); then
              # Existing bytes were verified above; only add missing names.
              gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "${missing_assets[@]}"
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Bid Sentry v${version}" --notes-file "$notes"
            mapfile -t upload_names < <(find release-assets/final -maxdepth 1 -type f ! -name 'release-manifest.json' -printf '%p\n' | sort)
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "${upload_names[@]}"
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" release-assets/final/release-manifest.json
          fi
          diff -u release-assets/expected-assets.txt <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false

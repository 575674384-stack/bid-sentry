name: WinCheck
on:
  workflow_dispatch:

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/unit/fileSafety.test.ts tests/integration/taskManager.test.ts tests/unit/validateExecutionResult.test.ts tests/integration/sanitizeJob.test.ts --reporter=verbose

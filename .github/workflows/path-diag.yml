name: PathDiag
on: workflow_dispatch:
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.18.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/unit/fileSafety.test.ts -t "publishes only a registered file" --reporter=verbose
        env: { BID_SENTRY_DIAG: '1' }
      - run: pnpm vitest run tests/unit/fileSafety.test.ts -t "overwrite mode backs up the original and restores it on rollback" --reporter=verbose
        env: { BID_SENTRY_DIAG: '1' }
